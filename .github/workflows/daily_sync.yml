name: Daily Active Browser Extensions Sync & Email Alert

on:
  schedule:
    # 매일 UTC 00:00 (한국 시간 오전 9:00) 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub 웹 콘솔에서 'Run workflow' 버튼으로 수동 즉시 실행 가능

concurrency:
  group: browser-extensions-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 확장 프로그램 필터링 및 검증 실행
        id: sync_step
        run: |
          python -u sync_extensions.py

      - name: 변경사항 감지 및 깃허브 커밋/푸시
        id: persist_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add malicious_browser_extensions_list.csv source_observations.json
          if git diff --staged --quiet; then
            echo "변경사항이 없습니다."
          else
            git commit -m "Auto-update: sync active malicious extensions [skip ci]"
            git push
            echo "성공적으로 커밋 및 푸시되었습니다."
          fi

      - name: 메일 설정 확인
        id: mail_config
        if: always()
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        shell: bash
        run: |
          for key in MAIL_SERVER MAIL_USERNAME MAIL_PASSWORD MAIL_TO; do
            if [ -z "${!key}" ]; then
              echo "::error::필수 Secret이 없습니다: $key. 결과 메일을 발송할 수 없습니다."
              exit 1
            fi
          done

      - name: 일일 실행 결과 리포트 생성
        id: daily_report
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.sync_step.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist_step.outcome }}
          NEW_COUNT: ${{ steps.sync_step.outputs.new_count }}
          ACTIVE_COUNT: ${{ steps.sync_step.outputs.active_count }}
          SOURCE_COUNT: ${{ steps.sync_step.outputs.source_count }}
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import os
          import re
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          success = os.environ.get('SYNC_OUTCOME') == 'success' and os.environ.get('PERSIST_OUTCOME') == 'success'
          status = '정상' if success else '실패'
          count = os.environ.get('NEW_COUNT') or '0'
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          escape = lambda value: html.escape(str(value), quote=True)
          summary = f'<h2>브라우저 확장 프로그램 IoC 일일 실행 결과: {status}</h2><p>실행 일시: {escape(now)} (KST)</p>'
          if success:
              summary += f"<p>원본 데이터: {escape(os.environ.get('SOURCE_COUNT') or '확인 불가')}건<br>조건을 충족한 CSV: {escape(os.environ.get('ACTIVE_COUNT') or '확인 불가')}건<br>신규 알림 대상: {escape(count)}건 (미발송 재시도 포함)</p>"
              if count == '0':
                  summary += '<p>오늘은 알림 대상 신규 IoC가 없습니다. 수집 및 저장소 동기화가 정상 완료되었습니다.</p>'
          else:
              summary += f"<p>수집 또는 저장소 동기화에 실패했습니다. 신규 IoC 유무를 확정할 수 없습니다.</p><p>수집 단계: {escape(os.environ.get('SYNC_OUTCOME') or '미실행')}<br>저장소 반영 단계: {escape(os.environ.get('PERSIST_OUTCOME') or '미실행')}</p>"
          summary += f'<p><a href="{escape(run_url)}">Actions 상세 실행 로그 확인</a></p>'
          detail = ''
          report_path = Path('new_extensions_report.html')
          if success and count != '0' and report_path.exists():
              detail = report_path.read_text(encoding='utf-8')
              detail = re.sub(r'(?is)^.*?<body[^>]*>', '', detail)
              detail = re.sub(r'(?is)</body>.*$', '', detail)
          body = '<html><body style="font-family:Arial,sans-serif;line-height:1.6;color:#333;max-width:900px;margin:auto;padding:20px">' + summary + detail + '</body></html>'
          Path('daily_status_report.html').write_text(body, encoding='utf-8')
          subject = f'[IoC 모니터링] 정상 | 신규 알림 {count}건' if success else '[IoC 모니터링] 실행 실패 | 로그 확인 필요'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'mail_subject={subject}\n')
          PY

      - name: 일일 실행 결과 이메일 발송
        if: always() && steps.mail_config.outcome == 'success' && steps.daily_report.outcome == 'success'
        id: send_mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.daily_report.outputs.mail_subject }}
          to: ${{ secrets.MAIL_TO }}
          from: "Chrome Extension Monitor <${{ secrets.MAIL_USERNAME }}>"
          html_body: file://daily_status_report.html

      - name: 발송 완료 기록
        if: steps.send_mail.outcome == 'success' && steps.sync_step.outcome == 'success' && steps.persist_step.outcome == 'success' && steps.sync_step.outputs.has_new == 'true'
        run: |
          python sync_extensions.py --ack-notifications
          git add source_observations.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: acknowledge extension alerts [skip ci]"
            git push
          fi
