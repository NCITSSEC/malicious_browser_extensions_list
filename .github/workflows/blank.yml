name: Daily Active Browser Extensions Sync & Email Alert

on:
  schedule:
    # 매일 UTC 00:00 (한국 시간 오전 9:00) 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 즉시 실행 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 확장 프로그램 필터링 및 검증 실행
        id: sync_step
        run: |
          python sync_extensions.py

      - name: 변경사항 감지 및 깃허브 커밋/푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add malicious_browser_extensions_list.csv
          if git diff --staged --quiet; then
            echo "변경사항이 없습니다."
          else
            git commit -m "Auto-update: sync active malicious extensions [skip ci]"
            git push
            echo "성공적으로 커밋 및 푸시되었습니다."
          fi

      - name: 신규 악성 확장 프로그램 발견 시 이메일 발송
        if: steps.sync_step.outputs.has_new == 'true' && env.MAIL_SERVER != ''
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨 [보안 알림] 신규 활성 악성 확장 프로그램 ${{ steps.sync_step.outputs.new_count }}건 감지"
          to: ${{ secrets.MAIL_TO }}
          from: "Chrome Extension Monitor <${{ secrets.MAIL_USERNAME }}>"
          html_body: file://new_extensions_report.html
