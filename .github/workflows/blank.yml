name: Daily Browser Extensions Sync

on:
  schedule:
    # 매일 UTC 00:00 (한국 시간 기준 매일 아침 09:00)에 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # Actions 탭에서 수동으로 'Run workflow' 버튼 눌러 테스트 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 커밋 및 푸시 권한 부여

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas requests

      - name: Run Sync Script
        id: sync_step
        run: python sync_extensions.py

      - name: Commit and Push Changes
        if: steps.sync_step.outputs.has_changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add browser_extensions_list.csv
          git commit -m "Auto-update: sync latest browser extensions [skip ci]"
          git push
