name: Daily Active Browser Extensions Sync

on:
  schedule:
    # 매일 UTC 00:00 (한국 시간 아침 9시)에 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # Actions 탭에서 언제든 즉시 수동 실행 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas requests

      - name: Run Active Extension Checker
        id: sync_step
        run: python sync_extensions.py

      - name: Commit and Push Changes
        if: steps.sync_step.outputs.has_changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add malicious_browser_extensions_list.csv
          git commit -m "Auto-update: add active malicious extensions [skip ci]"
          git push
